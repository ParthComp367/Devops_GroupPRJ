trigger:
  branches:
    include:
      - main

variables:
  buildConfiguration: 'Release'

pool:
  vmImage: 'windows-latest'

stages:
  # -------------------------
  # Stage 1: Build and Test
  # -------------------------
  - stage: BuildAndTest
    displayName: 'Build and Test Stage'
    jobs:
      - job: Build
        displayName: 'Build MVC App'
        steps:
          - checkout: self
            displayName: 'Checkout source'

          - task: UseDotNet@2
            displayName: 'Install .NET 8 SDK'
            inputs:
              packageType: 'sdk'
              version: '8.0.x'
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - task: DotNetCoreCLI@2
            displayName: 'Restore project'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'

          - task: DotNetCoreCLI@2
            displayName: 'Build project'
            inputs:
              command: 'build'
              projects: '**/*.csproj'
              arguments: '--configuration $(buildConfiguration)'

          - task: DotNetCoreCLI@2
            displayName: 'Run tests'
            inputs:
              command: 'test'
              projects: '**/*Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --collect:"Code Coverage"'
              publishTestResults: true

          - task: DotNetCoreCLI@2
            displayName: 'Publish project'
            inputs:
              command: 'publish'
              projects: '**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'mvc-app-drop'
              publishLocation: 'Container'

  # -------------------------
  # Stage 2: Deploy to Dev
  # -------------------------
  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - deployment: DeployToDev
        displayName: 'Deploy MVC App to Dev'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: mvc-app-drop

                - task: CopyFiles@2
                  displayName: 'Copy files to dev environment'
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/mvc-app-drop'
                    Contents: '**/*'
                    TargetFolder: '$(System.DefaultWorkingDirectory)/dev-deploy'

                - script: |
                    echo "🚀 Running MVC App in Development Environment on port 5000"
                    dotnet $(System.DefaultWorkingDirectory)/dev-deploy/Lab4_devops_groupprj.dll --urls "http://localhost:5000"
                  displayName: 'Run MVC App (Dev)'

  # -------------------------
  # Stage 3: Deploy to QA
  # -------------------------
  - stage: DeployQAT
    displayName: 'Deploy to QA'
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - deployment: DeployToQAT
        displayName: 'Deploy MVC App to QA'
        environment: 'qa'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: mvc-app-drop

                - task: CopyFiles@2
                  displayName: 'Copy files to QA environment'
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/mvc-app-drop'
                    Contents: '**/*'
                    TargetFolder: '$(System.DefaultWorkingDirectory)/qa-deploy'

                - script: |
                    echo "🚀 Running MVC App in QA Environment on port 5001"
                    dotnet $(System.DefaultWorkingDirectory)/qa-deploy/Lab4_devops_groupprj.dll --urls "http://localhost:5001"
                  displayName: 'Run MVC App (QA)'

  # -------------------------
  # Stage 4: Deploy to Staging
  # -------------------------
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: DeployQAT
    condition: succeeded()
    jobs:
      - deployment: DeployToStaging
        displayName: 'Deploy MVC App to Staging'
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: mvc-app-drop

                - task: CopyFiles@2
                  displayName: 'Copy files to Staging environment'
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/mvc-app-drop'
                    Contents: '**/*'
                    TargetFolder: '$(System.DefaultWorkingDirectory)/staging-deploy'

                - script: |
                    echo "🚀 Running MVC App in Staging Environment on port 5002"
                    dotnet $(System.DefaultWorkingDirectory)/staging-deploy/Lab4_devops_groupprj.dll --urls "http://localhost:5002"
                  displayName: 'Run MVC App (Staging)'
